# Public settings only. Keep API keys in deployment secrets.
[site]
title = "today.duinlab.nl"
url = "https://today.duinlab.nl"
description = "A daily page from The Hague: the weather, pictures, sourced facts, a word, a quiz and daily games."

[location]
name = "The Hague"
latitude = 52.08
longitude = 4.31
timezone = "Europe/Amsterdam"
country = "NL"

[units]
temperature = "celsius"
wind = "kmh"

[content]
pictures = ["apod", "met", "wikipedia", "aic", "rijks"]
tides = true
sea = true
events = true
radar = "knmi"
holidays = "nl"

[[games]]
id = "factmap"
name = "Factmap"
url = "https://www.factmap.world/"
blurb = "Place the day's facts on the map."

[[games]]
id = "timeguessr"
name = "TimeGuessr"
url = "https://timeguessr.com/"
blurb = "Guess where and when a photo was taken."

[[games]]
id = "shikaku"
name = "Shikaku of the day"
url = "https://shikakuofthe.day/"
blurb = "Cut the grid into rectangles that match the numbers."

[[games]]
id = "krillion"
name = "Krillion"
url = "https://krillion.io/"
blurb = "Seven prompts; the rarer your answer, the deeper you dive."

[[games]]
id = "catfishing"
name = "Catfishing"
url = "https://catfishing.net/"
blurb = "Work out which animal is hiding behind the clues."

[[games]]
id = "connections"
name = "Connections"
url = "https://www.nytimes.com/games/connections"
blurb = "Sort sixteen words into four groups."

[[games]]
id = "wordle"
name = "Wordle"
url = "https://www.nytimes.com/games/wordle/index.html"
blurb = "Five letters, six tries."

[[games]]
id = "metazooa"
name = "Metazooa"
url = "https://metazooa.com/"
blurb = "Find the mystery animal by how closely related your guesses are."

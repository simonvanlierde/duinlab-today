# pnpm reads its project settings here, not from .npmrc. One package, so no
# `packages:` list.

# Resolve only releases at least a week old (in minutes): a compromised release
# is usually caught and yanked within that window.
minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
# esbuild and workerd run install scripts to set up their binaries; pnpm refuses
# an install that skips a build no one has allowed or denied.
allowBuilds:
  esbuild: true
  workerd: true

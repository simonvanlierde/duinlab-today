name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only: a newer push to main must not cancel a production deploy in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The e2e container's tag must match the installed Playwright exactly.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      # Known advisories, moderate and up, in what ships.
      - run: pnpm audit --prod --audit-level=moderate

  e2e:
    name: e2e (chromium)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The tag comes from the lockfile, so no digest can be pinned next to it.
      image: mcr.microsoft.com/playwright:v${{ needs.check.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without a Latin font the image falls back to a CJK font whose narrow glyphs hide overflow.
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-dejavu-core
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e

  # Every push to main deploys. The token lives only in the production environment, which
  # only main may use; without it the job skips with a notice.
  production:
    name: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://today.duinlab.nl
    steps:
      # The token is passed only to the steps that need it, not to install scripts or the build.
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Production deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm run build
      - if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # Re-putting an unchanged secret is harmless; without it the picture falls back to The Met.
      - if: steps.gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          if [ -n "$NASA_API_KEY" ]; then
            printf '%s' "$NASA_API_KEY" | pnpm exec wrangler secret put NASA_API_KEY
          fi
      - if: steps.gate.outputs.run == 'true'
        run: |
          # a just-created custom domain can take minutes to resolve, and an HTTP error is not a
          # curl error, so --retry would not retry it: loop, and print what came back
          for _ in $(seq 1 12); do
            code=$(curl -sS -o today.out -w '%{http_code}' https://today.duinlab.nl/today.json || true)
            [ "$code" = 200 ] && break
            echo "today.json answered ${code:-nothing}: $(head -c 200 today.out 2>/dev/null)"
            sleep 15
          done
          test "$code" = 200
          curl -fsS --retry 3 https://today.duinlab.nl/ | grep -q '<h1'

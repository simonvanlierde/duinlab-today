name: cold install

# Runs the README's setup and check commands in a fresh container that has none
# of the project's dependencies preinstalled, catching missing setup steps early.
on:
  pull_request:
    paths: [README.md, .github/workflows/cold-install.yml, justfile, package.json, pnpm-lock.yaml, pnpm-workspace.yaml]
  schedule:
    - cron: "47 5 * * 1" # Mondays, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: fresh container install and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: buildpack-deps:trixie@sha256:5214476af627916270063c9f99a969381f32cd961c861ea95e740ba71abc125f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just@1.49.0
          fallback: none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install and check from a clean slate
        run: |-
          # The runner's user owns the checkout and this container runs as root.
          chown -R "$(id -u):$(id -g)" .
          pnpm install --frozen-lockfile
          just check
